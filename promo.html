<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="افزایش فالوور واقعی اینستاگرام با کیفیت بالا — AfghanFollower">
<title>AfghanFollower — رشد واقعی اینستاگرام</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040B28;
  --primary:#0B3D91;
  --secondary:#132A63;
  --accent:#FF9F1A;
  --white:#FFFFFF;
  --glass:rgba(255,255,255,0.055);
  --glass-border:rgba(255,255,255,0.11);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:Vazirmatn,Tahoma,'Arial Unicode MS',Arial,sans-serif;
  background:var(--bg);
  color:var(--white);
  direction:rtl;
  overflow-x:hidden;
  min-height:100vh;
}

/* ── Background ── */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);}
.orb1{width:700px;height:700px;background:radial-gradient(circle,rgba(11,61,145,.40) 0%,transparent 70%);top:-250px;right:-150px;}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(255,159,26,.10) 0%,transparent 70%);bottom:0;left:-120px;}
.orb3{width:400px;height:400px;background:radial-gradient(circle,rgba(100,50,200,.15) 0%,transparent 70%);top:40%;left:30%;}

section{position:relative;z-index:1;}

/* ═══ HERO ═══ */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:100px 24px 80px;
  text-align:center;
}

.logo-wrap{
  position:relative;
  margin-bottom:36px;
  animation:fadeDown .9s ease both;
}
.logo-halo{
  position:absolute;
  inset:-18px;
  border-radius:54px;
  background:radial-gradient(circle,rgba(50,130,255,.25) 0%,transparent 70%);
  animation:pulseHalo 3s ease-in-out infinite;
  pointer-events:none;
}
.logo-ring-outer{
  position:absolute;
  inset:-12px;
  border-radius:50px;
  border:1px solid rgba(100,170,255,.18);
  animation:spin 22s linear infinite;
}
.logo-ring-outer::before{
  content:'';
  position:absolute;
  top:-5px;left:50%;
  width:10px;height:10px;
  background:#4aa0ff;
  border-radius:50%;
  box-shadow:0 0 12px #4aa0ff,0 0 24px #4aa0ff;
  transform:translateX(-50%);
}
.logo-box{
  width:190px;height:190px;
  background:linear-gradient(145deg,#1840c8 0%,#0c1e82 60%,#070f5c 100%);
  border-radius:42px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(100,170,255,.40);
  box-shadow:
    0 0 22px rgba(50,140,255,1),
    0 0 50px rgba(30,110,255,.80),
    0 0 100px rgba(10,90,255,.50),
    0 0 200px rgba(0,60,255,.22);
  position:relative;overflow:hidden;
}
.logo-box::after{
  content:'';position:absolute;top:0;left:0;right:0;
  height:44%;
  background:linear-gradient(180deg,rgba(160,220,255,.20) 0%,transparent 100%);
  border-radius:40px 40px 0 0;
}
.logo-box img{width:136px;position:relative;z-index:1;}

.ig-wrap{margin-bottom:32px;animation:fadeUp .9s .15s ease both;}
.ig-icon{
  width:68px;height:68px;
  display:block;margin:0 auto;
  filter:drop-shadow(0 4px 18px rgba(200,60,140,.65));
  transition:transform .3s ease;
}
.ig-icon:hover{transform:scale(1.1) rotate(-5deg);}

.hero h1{
  font-size:clamp(26px,4.5vw,52px);
  font-weight:800;
  line-height:1.35;
  margin-bottom:20px;
  animation:fadeUp .9s .25s ease both;
}
.hero h1 .accent{
  display:block;
  color:var(--accent);
  font-family:'Helvetica Neue',Arial,sans-serif;
  text-shadow:0 0 28px rgba(255,159,26,.45);
  direction:ltr;
}

.hero p{
  font-size:clamp(13px,1.8vw,17px);
  color:rgba(255,255,255,.60);
  max-width:540px;
  line-height:1.9;
  margin-bottom:44px;
  animation:fadeUp .9s .35s ease both;
}

.btn-cta{
  display:inline-flex;
  align-items:center;
  gap:14px;
  padding:18px 52px;
  background:linear-gradient(135deg,#FFB020 0%,#FF6A00 100%);
  color:white;
  font-size:19px;
  font-weight:800;
  border-radius:60px;
  text-decoration:none;
  box-shadow:0 10px 36px rgba(255,140,0,.52),0 0 70px rgba(255,140,0,.12);
  transition:transform .3s ease,box-shadow .3s ease;
  animation:fadeUp .9s .45s ease both,pulseBtn 3.5s 1.5s ease-in-out infinite;
  position:relative;overflow:hidden;
}
.btn-cta::after{
  content:'';
  position:absolute;
  top:0;left:-120%;
  width:80%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-20deg);
  animation:shine 4s 2s ease-in-out infinite;
}
.btn-cta:hover{
  transform:translateY(-5px) scale(1.03);
  box-shadow:0 18px 56px rgba(255,140,0,.70),0 0 90px rgba(255,140,0,.20);
}
.btn-circle{
  width:38px;height:38px;
  background:rgba(255,255,255,.22);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}

/* ═══ FEATURES ═══ */
.features{
  padding:80px 24px;
  max-width:1100px;
  margin:0 auto;
}
.features-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
.card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:24px;
  padding:36px 16px 28px;
  text-align:center;
  transition:transform .4s ease,border-color .4s ease,box-shadow .4s ease;
  position:relative;overflow:hidden;
  opacity:0;transform:translateY(30px);
}
.card.visible{animation:fadeUp .7s ease forwards;}
.card:nth-child(2).visible{animation-delay:.1s;}
.card:nth-child(3).visible{animation-delay:.2s;}
.card:nth-child(4).visible{animation-delay:.3s;}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 55%);
  opacity:0;transition:opacity .4s ease;
}
.card:hover::before{opacity:1;}
.card:hover{
  transform:translateY(-10px);
  border-color:rgba(255,159,26,.38);
  box-shadow:0 24px 64px rgba(0,0,0,.3),0 0 50px rgba(255,159,26,.12);
}
.card-icon{font-size:44px;display:block;margin-bottom:18px;animation:float 4s ease-in-out infinite;}
.card:nth-child(2) .card-icon{animation-delay:.6s;}
.card:nth-child(3) .card-icon{animation-delay:1.2s;}
.card:nth-child(4) .card-icon{animation-delay:1.8s;}
.card h3{font-size:15px;font-weight:700;margin-bottom:7px;}
.card p{font-size:12px;color:rgba(255,255,255,.50);}
.divider{width:80px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:0 auto 16px;border-radius:2px;}

/* ═══ FOOTER ═══ */
footer{
  position:relative;z-index:1;
  padding:36px 24px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.07);
  color:rgba(255,255,255,.40);
  font-size:15px;
}
footer a{color:var(--accent);text-decoration:none;transition:text-shadow .3s;}
footer a:hover{text-shadow:0 0 14px var(--accent);}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeDown{from{opacity:0;transform:translateY(-28px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes pulseHalo{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.06);}}
@keyframes pulseBtn{0%,100%{box-shadow:0 10px 36px rgba(255,140,0,.52),0 0 70px rgba(255,140,0,.12);}50%{box-shadow:0 10px 48px rgba(255,140,0,.72),0 0 100px rgba(255,140,0,.22);}}
@keyframes shine{0%{left:-120%;}50%,100%{left:140%;}}

/* ═══ RESPONSIVE ═══ */
@media(max-width:800px){.features-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){
  .features-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .card{padding:24px 10px 20px;}
  .card-icon{font-size:34px;}
  .logo-box{width:160px;height:160px;border-radius:36px;}
  .logo-box img{width:116px;}
  .btn-cta{font-size:17px;padding:16px 36px;}
}
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>
<canvas id="particles"></canvas>

<!-- ═══ HERO ═══ -->
<section class="hero">

  <div class="logo-wrap">
    <div class="logo-halo"></div>
    <div class="logo-ring-outer"></div>
    <div class="logo-box">
      <img src="/icons/logo-full.png" alt="AfghanFollower">
    </div>
  </div>

  <div class="ig-wrap">
    <svg class="ig-icon" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="igG" cx="30%" cy="100%" r="130%">
          <stop offset="0%" stop-color="#feda77"/>
          <stop offset="20%" stop-color="#f77737"/>
          <stop offset="42%" stop-color="#ee2a7b"/>
          <stop offset="68%" stop-color="#8a3ab9"/>
          <stop offset="100%" stop-color="#4f5bd5"/>
        </radialGradient>
      </defs>
      <rect width="70" height="70" rx="18" fill="url(#igG)"/>
      <rect x="19" y="19" width="32" height="32" rx="8" fill="none" stroke="white" stroke-width="3.5"/>
      <circle cx="35" cy="35" r="8" fill="none" stroke="white" stroke-width="3.5"/>
      <circle cx="47" cy="23" r="2.8" fill="white"/>
    </svg>
  </div>

  <h1>
    رشد واقعی اینستاگرام
    <span class="accent">با AfghanFollower</span>
  </h1>

  <p>افزایش فالوور واقعی، لایک، ویو و تعامل با کیفیت بالا،<br>تحویل سریع و پشتیبانی ۲۴ ساعته.</p>

  <a href="/smm-panel.html" class="btn-cta">
    <div class="btn-circle">›</div>
    همین حالا شروع کنید
  </a>

</section>

<!-- ═══ FEATURES ═══ -->
<section class="features">
  <div class="features-grid">
    <div class="card">
      <span class="card-icon">👥</span>
      <div class="divider"></div>
      <h3>فالوور واقعی</h3>
      <p>با کیفیت بالا</p>
    </div>
    <div class="card">
      <span class="card-icon">❤️</span>
      <div class="divider"></div>
      <h3>لایک و ویو</h3>
      <p>تعامل بالا</p>
    </div>
    <div class="card">
      <span class="card-icon">⚡</span>
      <div class="divider"></div>
      <h3>تحویل سریع</h3>
      <p>و مطمئن</p>
    </div>
    <div class="card">
      <span class="card-icon">🎧</span>
      <div class="divider"></div>
      <h3>پشتیبانی</h3>
      <p>۲۴ ساعته</p>
    </div>
  </div>
</section>

<!-- ═══ FOOTER ═══ -->
<footer>
  🌐 <a href="https://afghanfollowers.online">afghanfollowers.online</a>
</footer>

<script>
// ── Floating particles ──
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, pts = [];

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

class Dot {
  constructor() { this.init(); }
  init() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = Math.random() * 1.8 + .4;
    this.vx = (Math.random() - .5) * .35;
    this.vy = (Math.random() - .5) * .35;
    this.a = Math.random() * .45 + .08;
    this.hue = Math.random() > .55 ? '255,159,26' : '80,150,255';
  }
  step() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.init();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.hue},${this.a})`;
    ctx.fill();
  }
}

for (let i = 0; i < 90; i++) pts.push(new Dot());

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < pts.length; i++) {
    pts[i].step(); pts[i].draw();
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
      const d = Math.hypot(dx, dy);
      if (d < 110) {
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.strokeStyle = `rgba(80,150,255,${.07 * (1 - d / 110)})`;
        ctx.lineWidth = .5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();

// ── Scroll reveal ──
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: .15 });
document.querySelectorAll('.card').forEach(c => io.observe(c));
</script>

</body>
</html>
